name: 功能建议
description: 建议一个明确的改进或新功能
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明实际使用场景，不要只写功能名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: hardware
    attributes:
      label: 是否依赖特定硬件
      options:
        - 否
        - 是，需要相机
        - 是，需要PLC
        - 是，需要相机和PLC
    validations:
      required: true
