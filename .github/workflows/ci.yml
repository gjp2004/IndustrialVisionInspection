name: build-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/IndustrialVisionStudent.Tests/IndustrialVisionStudent.Tests.csproj

      - name: Test
        run: dotnet test tests/IndustrialVisionStudent.Tests/IndustrialVisionStudent.Tests.csproj -c Release --no-restore --nologo

      - name: Publish
        run: dotnet publish IndustrialVisionStudent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish --nologo

      - name: Smoke test published application
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-published.ps1 -Executable artifacts/publish/IndustrialVisionStudent.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: IndustrialVisionStudent-win-x64
          path: artifacts/publish
          if-no-files-found: error
