name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/IndustrialVisionStudent.Tests/IndustrialVisionStudent.Tests.csproj

      - name: Restore Windows application
        run: dotnet restore IndustrialVisionStudent.csproj -r win-x64

      - name: Test
        run: dotnet test tests/IndustrialVisionStudent.Tests/IndustrialVisionStudent.Tests.csproj -c Release --no-restore --nologo

      - name: Publish
        run: dotnet publish IndustrialVisionStudent.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish --nologo

      - name: Smoke test published application
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-published.ps1 -Executable artifacts/publish/IndustrialVisionStudent.exe

      - name: Create release archive
        shell: powershell
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/IndustrialVisionStudent-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "artifacts/IndustrialVisionStudent-${{ github.ref_name }}-win-x64.zip" --verify-tag --generate-notes --title "IndustrialVisionStudent ${{ github.ref_name }}"
